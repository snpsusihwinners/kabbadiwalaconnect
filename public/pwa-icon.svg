<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Subtle circuit background lines -->
  <path d="M80 160 L180 160 L220 200" stroke="#34d399" stroke-width="4" stroke-opacity="0.25" fill="none" stroke-linecap="round"/>
  <circle cx="80" cy="160" r="6" fill="#34d399" fill-opacity="0.4"/>
  
  <path d="M432 352 L332 352 L292 312" stroke="#34d399" stroke-width="4" stroke-opacity="0.25" fill="none" stroke-linecap="round"/>
  <circle cx="432" cy="352" r="6" fill="#34d399" fill-opacity="0.4"/>

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="230" r="130" fill="url(#glowGrad)"/>

  <!-- Main Central Emblem: Recycling Loop + Circuit Core -->
  <g filter="url(#shadow)">
    <!-- Center white rounded backing -->
    <circle cx="256" cy="230" r="112" fill="#ffffff" fill-opacity="0.96"/>

    <!-- Leaf / Recycling Arrows in Emerald -->
    <!-- Node 1: Top Arrow -->
    <path d="M256 142 L280 178 H266 C266 215 285 240 318 250 L310 264 C268 250 248 220 248 178 H232 Z" fill="#059669"/>
    
    <!-- Node 2: Bottom Right Arrow -->
    <path d="M335 272 L311 308 L298 298 C270 318 240 312 215 286 L224 274 C244 296 268 300 292 284 L280 274 Z" fill="#047857"/>

    <!-- Node 3: Bottom Left Arrow / Leaf -->
    <path d="M177 272 L215 264 L212 278 C218 312 248 330 280 334 L276 348 C238 344 204 322 198 284 L185 288 Z" fill="#10b981"/>

    <!-- Center Chip / Diamond core -->
    <rect x="238" y="212" width="36" height="36" rx="8" fill="#059669"/>
    <rect x="244" y="218" width="24" height="24" rx="4" fill="#34d399"/>
    <circle cx="256" cy="230" r="5" fill="#ffffff"/>
    
    <!-- Chip connector pins -->
    <line x1="232" y1="222" x2="238" y2="222" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <line x1="232" y1="238" x2="238" y2="238" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <line x1="274" y1="222" x2="280" y2="222" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <line x1="274" y1="238" x2="280" y2="238" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <line x1="248" y1="206" x2="248" y2="212" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <line x1="264" y1="206" x2="264" y2="212" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <line x1="248" y1="248" x2="248" y2="254" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <line x1="264" y1="248" x2="264" y2="254" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ECOSETU Typography at Bottom -->
  <text x="256" y="412" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="6">ECOSETU</text>
  <text x="256" y="446" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="4">E-WASTE CIRCULATION</text>
</svg>
